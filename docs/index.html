<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>老张新闻源</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1f2430;--ink2:#5a6472;--ink3:#8b95a3;
    --line:#e4e8ee;--blue:#2563eb;--blue-l:#eef4ff;--green:#0d9488;--green-l:#e8f7f4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:0 14px 60px}
  header{padding:22px 2px 10px}
  h1{font-size:21px;margin:0;letter-spacing:-.3px}
  .meta{color:var(--ink3);font-size:12.5px;margin-top:3px}
  .tabs{display:flex;gap:8px;margin:14px 0 4px;position:sticky;top:0;background:var(--bg);
    padding:10px 0;z-index:5}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink2);font-size:14.5px;font-weight:600;cursor:pointer;user-select:none}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .note{font-size:12.5px;color:var(--ink3);margin:6px 2px 10px}
  .item{display:block;background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:14px 15px;margin:10px 0;text-decoration:none;color:inherit;
    box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.8px;margin-bottom:6px}
  .blk{padding:1.5px 8px;border-radius:6px;font-weight:600;background:var(--blue-l);color:var(--blue)}
  .blk.zb{background:var(--green-l);color:var(--green)}
  .new{padding:1.5px 7px;border-radius:6px;font-weight:700;background:#fee2e2;color:#dc2626}
  .src{color:var(--ink3)}
  .time{color:var(--ink3);margin-left:auto}
  .t{font-size:15.5px;font-weight:600;line-height:1.55}
  .s{color:var(--ink2);font-size:13.4px;margin-top:5px;display:-webkit-box;
    -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .empty{text-align:center;color:var(--ink3);padding:60px 0;font-size:14px}
  footer{color:var(--ink3);font-size:12px;text-align:center;line-height:1.9;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📰 老张新闻源</h1>
    <div class="meta" id="meta">加载中…</div>
  </header>

  <div class="tabs">
    <div class="tab on" id="tab-morning" data-ed="morning">☕ 早咖啡</div>
    <div class="tab" id="tab-afternoon" data-ed="afternoon">🍵 下午茶</div>
  </div>
  <div class="note" id="note"></div>
  <div id="list"><div class="empty">加载中…</div></div>

  <footer>谷歌精选 + 联合早报 · 各取最新 10 条 · 每天 07:00 / 15:20 抓取<br>仅供研究参考，不构成投资建议</footer>
</div>

<script>
(function () {
  var state = { ed: 'morning', cache: {} };

  function today() {
    var d = new Date(Date.now() + 8 * 3600e3);   // 北京日期
    return d.toISOString().slice(0, 10);
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g,
      function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function getJSON(u) {
    return fetch(u + '?t=' + Date.now()).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  /* 优先当天本场次 → 没有则 latest.json（可能属于另一场，会提示） */
  function load(ed) {
    if (state.cache[ed]) return Promise.resolve(state.cache[ed]);
    return getJSON('news/' + today() + '-' + ed + '.json')
      .catch(function () { return getJSON('latest.json'); })
      .then(function (j) { state.cache[ed] = j; return j; });
  }
  function render(j) {
    document.getElementById('meta').textContent =
      (j.date || '') + ' · 抓取于 ' + (j.fetched_at || '?') +
      (j.translator && j.translator.indexOf('none') === 0 ? ' · 未翻译（未配置 LLM Key）' : '');
    var items = j.items || [];
    if (!items.length) {
      document.getElementById('list').innerHTML = '<div class="empty">今天还没有数据</div>';
      return;
    }
    document.getElementById('list').innerHTML = items.map(function (i) {
      var zb = /早报/.test(i.block || '');
      return '<a class="item" href="' + esc(i.url) + '" target="_blank" rel="noopener">' +
        '<div class="row">' +
          '<span class="blk' + (zb ? ' zb' : '') + '">' + esc(i.block) + '</span>' +
          (i.isNew ? '<span class="new">新</span>' : '') +
          (i.source ? '<span class="src">' + esc(i.source) + '</span>' : '') +
          '<span class="time">' + esc(i.pubTime) + '</span>' +
        '</div>' +
        '<div class="t">' + esc(i.title) + '</div>' +
        (i.summary ? '<div class="s">' + esc(i.summary) + '</div>' : '') +
      '</a>';
    }).join('');
  }
  function show(ed) {
    state.ed = ed;
    document.getElementById('tab-morning').classList.toggle('on', ed === 'morning');
    document.getElementById('tab-afternoon').classList.toggle('on', ed === 'afternoon');
    document.getElementById('list').innerHTML = '<div class="empty">加载中…</div>';
    load(ed).then(function (j) {
      var match = j.edition === ed;
      document.getElementById('note').textContent = match ? '' :
        '（本场「' + (ed === 'morning' ? '早咖啡' : '下午茶') + '」还没生成，先显示最近一场：'
        + (j.editionName || j.edition) + ' ' + (j.date || '') + '）';
      render(j);
    }).catch(function (e) {
      document.getElementById('list').innerHTML =
        '<div class="empty">加载失败：' + esc(e.message) + '<br>稍后刷新再试</div>';
    });
  }
  document.getElementById('tab-morning').onclick = function () { show('morning'); };
  document.getElementById('tab-afternoon').onclick = function () { show('afternoon'); };

  /* 按当前北京时间选默认页签：15:00 后看下午茶 */
  var h = new Date(Date.now() + 8 * 3600e3).getUTCHours();
  show(h >= 15 ? 'afternoon' : 'morning');
})();
</script>
</body>
</html>
