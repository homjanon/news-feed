name: fetch-news

# 老张自建新闻源 · 每天两场（2026-09-15 起）
#   下午茶  北京 15:20
#   夜豆浆  北京 22:30
#
# ⚠️ 本 workflow 已【取消 GitHub Actions 定时】，只由 Cloudflare 定时触发（精确、不排共享队列）：
#    POST /repos/homjanon/news-feed/actions/workflows/fetch.yml/dispatches
#    {"ref":"main","inputs":{"edition":"afternoon"}}   ← 15:20（Token 需 repo + workflow 权限）
#    {"ref":"main","inputs":{"edition":"night"}}       ← 22:30
#    也可在 Actions 页面手动 Run workflow（可在界面上选场次）。
#
# ⚠️ 场次只会来自 inputs.edition，脚本侧不做时间判定：
#    调用方【必须显式传 inputs.edition】。若漏传或传空，GitHub 会落回下方 default: afternoon，
#    导致 22:30 那场也写成 {日期}-afternoon.json 覆盖当天下午茶，且不报错（静默覆盖）。
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 场次
        type: choice
        options: [afternoon, night]
        default: afternoon
        required: true
permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 判定场次（本 workflow 只由 Cloudflare 定时 / 手动触发，直接用输入值）
        id: ed
        run: echo "edition=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"

      - name: 抓取并生成 JSON
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_news.py --edition "${{ steps.ed.outputs.edition }}" --outdir docs

      - name: 清理超过 7 天的归档
        run: |
          mkdir -p docs/news
          find docs/news -name '*.json' -mtime +7 -delete

      - name: 提交发布
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "news: $(TZ=Asia/Shanghai date +%F) ${{ steps.ed.outputs.edition }}"
            git push
          fi
